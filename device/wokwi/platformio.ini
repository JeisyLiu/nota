; PlatformIO project for the Nota voice button (ESP32 devkit v1, Wokwi compatible).
;
;   pip install platformio
;   cd device/firmware && pio run
;   cd device/wokwi && wokwi-cli .      (or the VS Code extension)

[env:esp32dev]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600

lib_deps =
    bblanchon/ArduinoJson@^7.2.0

build_flags =
    -DNOTA_WIFI_SSID=\"Wokwi-GUEST\"
    -DNOTA_WIFI_PASS=\"\"
    -DNOTA_API_BASE=\"http://host.wokwi.internal:8787\"
    -DNOTA_MACHINE_CODE=\"A1B2C3D4E5F6\"

; INMP441 is not a built-in Wokwi part, so the simulator build feeds the I2S
; driver a synthetic tone (see nota_button.ino, NOTA_SIMULATED_MIC).
build_src_filter = +<*> +<../firmware/>

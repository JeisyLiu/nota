name: nota_app
description: "Nota — 随口说，剩下的我来。移动端客户端。"
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.0
  # 录音（AAC/m4a，服务端用 ffmpeg 转 wav 再送 whisper）。
  # 锁在 5.1.x：record 5.2 把 record_platform_interface 升到 1.6.0，而
  # record_linux 0.7.2 还没跟上，`flutter build apk` 会在 kernel_snapshot 阶段
  # 因为 hasPermission/startStream 的签名不匹配而失败。
  record: ">=5.1.0 <5.2.0"
  record_platform_interface: ">=1.2.0 <1.3.0"
  cross_file: ^0.3.4        # 跨平台读文件字节（移动端读路径，Web 读 blob URL）
  path_provider: ^2.1.0
  shared_preferences: ^2.2.0
  intl: ^0.19.0
  # 录音时的实时转写走 WebSocket；这个包在桌面/移动端用 dart:io，在 Web 用
  # 浏览器 WebSocket，所以同一份代码两边都能编译。
  web_socket_channel: ^3.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

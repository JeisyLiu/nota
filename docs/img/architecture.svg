<svg xmlns="http://www.w3.org/2000/svg" width="960" height="620" viewBox="0 0 960 620" font-family="'Segoe UI','Microsoft YaHei',sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6b7280"/>
    </marker>
    <marker id="arrowAccent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#10b981"/>
    </marker>
  </defs>

  <rect width="960" height="620" fill="#0f1115"/>

  <!-- ============ clients ============ -->
  <text x="30" y="34" fill="#8b93a7" font-size="12" letter-spacing="2">CLIENTS</text>

  <rect x="30" y="48" width="180" height="64" rx="10" fill="#171a21" stroke="#2a2f3a"/>
  <text x="120" y="76" fill="#e6e8ee" font-size="14" text-anchor="middle">Web 单页</text>
  <text x="120" y="96" fill="#8b93a7" font-size="11" text-anchor="middle">web/ · 三栏 · SSE</text>

  <rect x="30" y="126" width="180" height="64" rx="10" fill="#171a21" stroke="#2a2f3a"/>
  <text x="120" y="154" fill="#e6e8ee" font-size="14" text-anchor="middle">Flutter App</text>
  <text x="120" y="174" fill="#8b93a7" font-size="11" text-anchor="middle">录音 / 列表 / Trace</text>

  <rect x="30" y="204" width="180" height="64" rx="10" fill="#171a21" stroke="#2a2f3a"/>
  <text x="120" y="232" fill="#e6e8ee" font-size="14" text-anchor="middle">ESP32 语音按钮</text>
  <text x="120" y="252" fill="#8b93a7" font-size="11" text-anchor="middle">I2S · WAV · WS</text>

  <!-- ============ interfaces ============ -->
  <text x="300" y="34" fill="#8b93a7" font-size="12" letter-spacing="2">INTERFACES</text>
  <rect x="290" y="48" width="200" height="220" rx="10" fill="#141b22" stroke="#38bdf8" stroke-opacity="0.5"/>
  <text x="390" y="72" fill="#38bdf8" font-size="13" text-anchor="middle">FastAPI</text>
  <text x="306" y="100" fill="#b8c0d4" font-size="11">POST /api/notes/text</text>
  <text x="306" y="120" fill="#b8c0d4" font-size="11">POST /api/notes/audio</text>
  <text x="306" y="140" fill="#b8c0d4" font-size="11">GET  /api/jobs/{id}</text>
  <text x="306" y="160" fill="#b8c0d4" font-size="11">GET  /api/jobs/{id}/stream</text>
  <text x="306" y="180" fill="#b8c0d4" font-size="11">POST /api/ask</text>
  <text x="306" y="200" fill="#b8c0d4" font-size="11">POST /api/actions/{id}</text>
  <text x="306" y="220" fill="#b8c0d4" font-size="11">WS   /ws/device</text>
  <text x="306" y="248" fill="#6b7280" font-size="10">SSE 推送 + 设备保活</text>

  <!-- ============ application ============ -->
  <text x="560" y="34" fill="#8b93a7" font-size="12" letter-spacing="2">APPLICATION</text>
  <rect x="548" y="48" width="220" height="246" rx="10" fill="#141b22" stroke="#6ee7b7" stroke-opacity="0.5"/>
  <text x="658" y="72" fill="#6ee7b7" font-size="13" text-anchor="middle">use cases</text>

  <rect x="564" y="84" width="188" height="40" rx="6" fill="#1d212a" stroke="#2a2f3a"/>
  <text x="658" y="101" fill="#e6e8ee" font-size="12" text-anchor="middle">ingest_note</text>
  <text x="658" y="116" fill="#8b93a7" font-size="10" text-anchor="middle">幂等 + 原子预占额度</text>

  <rect x="564" y="132" width="188" height="40" rx="6" fill="#1d212a" stroke="#2a2f3a"/>
  <text x="658" y="149" fill="#e6e8ee" font-size="12" text-anchor="middle">Pipeline (worker)</text>
  <text x="658" y="164" fill="#8b93a7" font-size="10" text-anchor="middle">状态机 · 退避重试 · 退款</text>

  <rect x="564" y="180" width="188" height="40" rx="6" fill="#1d212a" stroke="#2a2f3a"/>
  <text x="658" y="197" fill="#e6e8ee" font-size="12" text-anchor="middle">AgentHarness</text>
  <text x="658" y="212" fill="#8b93a7" font-size="10" text-anchor="middle">≤6 轮 · 审批闸门</text>

  <rect x="564" y="228" width="188" height="40" rx="6" fill="#1d212a" stroke="#2a2f3a"/>
  <text x="658" y="245" fill="#e6e8ee" font-size="12" text-anchor="middle">ToolRegistry · AskService</text>
  <text x="658" y="260" fill="#8b93a7" font-size="10" text-anchor="middle">6 工具 · 记忆问答</text>

  <!-- ============ domain ============ -->
  <rect x="548" y="312" width="220" height="120" rx="10" fill="#1a1622" stroke="#a78bfa" stroke-opacity="0.5"/>
  <text x="658" y="336" fill="#a78bfa" font-size="13" text-anchor="middle">domain（零依赖）</text>
  <text x="564" y="360" fill="#b8c0d4" font-size="11">quota.py   额度规则</text>
  <text x="564" y="380" fill="#b8c0d4" font-size="11">jobs.py    状态机白名单</text>
  <text x="564" y="400" fill="#b8c0d4" font-size="11">timeparse.py 中文时间</text>
  <text x="564" y="420" fill="#b8c0d4" font-size="11">memory.py  RRF 融合</text>

  <!-- ============ infrastructure ============ -->
  <rect x="800" y="48" width="130" height="384" rx="10" fill="#141b22" stroke="#fbbf24" stroke-opacity="0.45"/>
  <text x="865" y="72" fill="#fbbf24" font-size="12" text-anchor="middle">infra</text>
  <text x="865" y="98" fill="#b8c0d4" font-size="11" text-anchor="middle">SQLite WAL</text>
  <text x="865" y="118" fill="#8b93a7" font-size="10" text-anchor="middle">FTS5 trigram</text>
  <line x1="820" y1="134" x2="910" y2="134" stroke="#2a2f3a"/>
  <text x="865" y="156" fill="#b8c0d4" font-size="11" text-anchor="middle">LLM provider</text>
  <text x="865" y="174" fill="#8b93a7" font-size="10" text-anchor="middle">scripted</text>
  <text x="865" y="190" fill="#8b93a7" font-size="10" text-anchor="middle">openai 兼容</text>
  <text x="865" y="206" fill="#8b93a7" font-size="10" text-anchor="middle">anthropic</text>
  <line x1="820" y1="222" x2="910" y2="222" stroke="#2a2f3a"/>
  <text x="865" y="244" fill="#b8c0d4" font-size="11" text-anchor="middle">STT</text>
  <text x="865" y="262" fill="#8b93a7" font-size="10" text-anchor="middle">faster-whisper</text>
  <text x="865" y="278" fill="#8b93a7" font-size="10" text-anchor="middle">noop</text>
  <line x1="820" y1="294" x2="910" y2="294" stroke="#2a2f3a"/>
  <text x="865" y="316" fill="#b8c0d4" font-size="11" text-anchor="middle">clock</text>
  <text x="865" y="334" fill="#8b93a7" font-size="10" text-anchor="middle">可注入</text>

  <!-- ============ arrows: clients -> interfaces ============ -->
  <line x1="210" y1="80" x2="286" y2="80" stroke="#6b7280" marker-end="url(#arrow)"/>
  <line x1="210" y1="158" x2="286" y2="158" stroke="#6b7280" marker-end="url(#arrow)"/>
  <line x1="210" y1="236" x2="286" y2="236" stroke="#6b7280" marker-end="url(#arrow)"/>

  <!-- interfaces -> application -->
  <line x1="490" y1="120" x2="544" y2="120" stroke="#10b981" marker-end="url(#arrowAccent)"/>
  <line x1="490" y1="190" x2="544" y2="200" stroke="#10b981" marker-end="url(#arrowAccent)"/>
  <text x="500" y="108" fill="#6ee7b7" font-size="10">调用</text>

  <!-- application -> domain -->
  <line x1="658" y1="272" x2="658" y2="308" stroke="#a78bfa" marker-end="url(#arrow)"/>

  <!-- application -> infra -->
  <line x1="768" y1="140" x2="796" y2="140" stroke="#fbbf24" marker-end="url(#arrow)"/>
  <line x1="768" y1="200" x2="796" y2="180" stroke="#fbbf24" marker-end="url(#arrow)"/>

  <!-- ============ eval band ============ -->
  <rect x="30" y="470" width="900" height="112" rx="10" fill="#141b22" stroke="#2a2f3a"/>
  <text x="48" y="496" fill="#8b93a7" font-size="12" letter-spacing="2">EVAL · 同一套代码路径，不 mock</text>

  <rect x="48" y="510" width="200" height="56" rx="8" fill="#1d212a" stroke="#2a2f3a"/>
  <text x="148" y="533" fill="#e6e8ee" font-size="12" text-anchor="middle">15 条标注语料</text>
  <text x="148" y="552" fill="#8b93a7" font-size="10" text-anchor="middle">+ 5 条历史问答</text>

  <line x1="248" y1="538" x2="288" y2="538" stroke="#6b7280" marker-end="url(#arrow)"/>

  <rect x="292" y="510" width="220" height="56" rx="8" fill="#1d212a" stroke="#2a2f3a"/>
  <text x="402" y="533" fill="#e6e8ee" font-size="12" text-anchor="middle">run_eval.py</text>
  <text x="402" y="552" fill="#8b93a7" font-size="10" text-anchor="middle">F1 / 时间 / 幻觉 / 引用</text>

  <line x1="512" y1="538" x2="552" y2="538" stroke="#6b7280" marker-end="url(#arrow)"/>

  <rect x="556" y="510" width="356" height="56" rx="8" fill="#12251f" stroke="#10b981" stroke-opacity="0.6"/>
  <text x="734" y="531" fill="#6ee7b7" font-size="12" text-anchor="middle">F1=1.000 · 时间 11/11 · 幻觉 0 · 编造引用 0</text>
  <text x="734" y="552" fill="#8b93a7" font-size="10" text-anchor="middle">tests/test_memory.py 每次 pytest 重跑，指标掉了就红</text>

  <text x="930" y="600" fill="#4b5563" font-size="10" text-anchor="end">nota / docs/architecture.md</text>
</svg>

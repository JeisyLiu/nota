<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Nota 管理台 · 登录</title>
<link rel="icon" href="data:," />
<link rel="stylesheet" href="/app.css" />
</head>
<body class="login-body">
<main class="login-wrap">
  <section class="login-card">
    <div class="brand brand-lg">
      <span class="dot"></span>
      <strong>Nota</strong>
      <span class="tag">管理台</span>
    </div>
    <p class="login-sub">登录后查看个人用量，管理员可进入全局面板。</p>

    <form id="login-form" class="login-form" autocomplete="on">
      <label for="username">用户名</label>
      <input id="username" name="username" autocomplete="username" required autofocus />
      <label for="password">密码</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required />
      <p id="login-error" class="form-error" role="alert"></p>
      <button type="submit" class="primary wide">登录</button>
    </form>

    <div class="demo-box">
      <div class="demo-title">演示账号（点一下自动填入）</div>
      <div class="demo-chips">
        <button type="button" class="chip" data-demo-user="admin" data-demo-pass="123456">
          admin · 管理员
        </button>
        <button type="button" class="chip" data-demo-user="zhangwei">zhangwei · 张伟</button>
        <button type="button" class="chip" data-demo-user="lina">lina · 李娜</button>
        <button type="button" class="chip" data-demo-user="wangfang">wangfang · 王芳</button>
        <button type="button" class="chip" data-demo-user="liuyang">liuyang · 刘洋</button>
        <button type="button" class="chip" data-demo-user="chenjing">chenjing · 陈静</button>
      </div>
      <p class="demo-hint">密码统一为 <code>123456</code>。</p>
    </div>
  </section>
</main>
<script type="module">
  import { initLoginForm, initDemoFill } from "/js/auth.js";
  initLoginForm();
  initDemoFill();
</script>
</body>
</html>
